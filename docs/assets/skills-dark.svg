<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Die vier Skills</title><desc id="d">scout-fast unter 1 Minute ohne Engine; briefing-medium 2 bis 5 Minuten mit Engine für 20 Partien; research-deep 15 bis 30 Minuten mit allen Quellen; team-prep ruft je Spieler eine Stufe auf.</desc>
