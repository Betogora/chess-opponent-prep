<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
  <title id="t">Die vier Skills</title>
  <desc id="d">scout-fast unter 1 Minute ohne Engine; briefing-medium wenige Minuten mit Engine für 20 Partien; research-deep 15 bis 30 Minuten mit allen Quellen; team-prep ruft für jeden Spieler einer Mannschaft eine der drei Stufen auf.</desc>
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <!-- Karte 1 -->
    <rect x="1" y="1" width="282" height="266" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="1" y="1" width="282" height="8" rx="4" fill="#236492"/>
    <text x="24" y="52" font-size="13" font-weight="700" fill="#4b5563" letter-spacing="1">STUFE 1</text>
    <text x="24" y="84" font-size="24" font-weight="700" fill="#111827">scout-fast</text>
    <rect x="24" y="100" width="94" height="28" rx="14" fill="#e8f1f8"/>
    <text x="71" y="119" font-size="14" font-weight="650" fill="#236492" text-anchor="middle">&lt; 1 min</text>
    <text x="24" y="160" font-size="15" fill="#374151">Steckbrief ohne Engine</text>
    <text x="24" y="184" font-size="15" fill="#374151">alle Partien, beide Farben</text>
    <text x="24" y="208" font-size="15" fill="#374151">Repertoire mit Score</text>
    <text x="24" y="242" font-size="13" fill="#6b7280" font-family="ui-monospace, Consolas, monospace">briefing.py scout</text>
    <!-- Karte 2 -->
    <rect x="306" y="1" width="282" height="266" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="306" y="1" width="282" height="8" rx="4" fill="#236492"/>
    <text x="329" y="52" font-size="13" font-weight="700" fill="#4b5563" letter-spacing="1">STUFE 2</text>
    <text x="329" y="84" font-size="24" font-weight="700" fill="#111827">briefing-medium</text>
    <rect x="329" y="100" width="112" height="28" rx="14" fill="#e8f1f8"/>
    <text x="385" y="119" font-size="14" font-weight="650" fill="#236492" text-anchor="middle">2 – 5 min</text>
    <text x="329" y="160" font-size="15" fill="#374151">Engine für 20 Partien</text>
    <text x="329" y="184" font-size="15" fill="#374151">eine Farbe oder beide</text>
    <text x="329" y="208" font-size="15" fill="#374151">kurzer belegter Matchplan</text>
    <text x="329" y="242" font-size="13" fill="#6b7280" font-family="ui-monospace, Consolas, monospace">briefing.py brief</text>
    <!-- Karte 3 -->
    <rect x="611" y="1" width="282" height="266" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="611" y="1" width="282" height="8" rx="4" fill="#236492"/>
    <text x="634" y="52" font-size="13" font-weight="700" fill="#4b5563" letter-spacing="1">STUFE 3</text>
    <text x="634" y="84" font-size="24" font-weight="700" fill="#111827">research-deep</text>
    <rect x="634" y="100" width="120" height="28" rx="14" fill="#e8f1f8"/>
    <text x="694" y="119" font-size="14" font-weight="650" fill="#236492" text-anchor="middle">15 – 30 min</text>
    <text x="634" y="160" font-size="15" fill="#374151">alle Quellen, alle Partien</text>
    <text x="634" y="184" font-size="15" fill="#374151">Online-Accounts, Profil</text>
    <text x="634" y="208" font-size="15" fill="#374151">Matchplan für beide Farben</text>
    <text x="634" y="242" font-size="13" fill="#6b7280" font-family="ui-monospace, Consolas, monospace">briefing.py prepare</text>
    <!-- Karte 4 -->
    <rect x="916" y="1" width="282" height="266" rx="14" fill="#ffffff" stroke="#b55b43" stroke-width="2"/>
    <rect x="916" y="1" width="282" height="8" rx="4" fill="#b55b43"/>
    <text x="939" y="52" font-size="13" font-weight="700" fill="#4b5563" letter-spacing="1">MANNSCHAFT</text>
    <text x="939" y="84" font-size="24" font-weight="700" fill="#111827">team-prep</text>
    <rect x="939" y="100" width="150" height="28" rx="14" fill="#f7ebe7"/>
    <text x="1014" y="119" font-size="14" font-weight="650" fill="#b55b43" text-anchor="middle">Stufe × Spieler</text>
    <text x="939" y="160" font-size="15" fill="#374151">Aufstellung einlesen</text>
    <text x="939" y="184" font-size="15" fill="#374151">je Spieler eine Stufe</text>
    <text x="939" y="208" font-size="15" fill="#374151">eine Seite, Spieler wählbar</text>
    <text x="939" y="242" font-size="13" fill="#6b7280" font-family="ui-monospace, Consolas, monospace">briefing.py team</text>
  </g>
</svg>
